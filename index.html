<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumensta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* For smooth page transitions */
    @keyframes slide-in-from-right {
      0% {
        transform: translateX(100%);
        opacity: 0;
      }
      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }
    .animate-slide-in-from-right {
      animation: slide-in-from-right 0.5s ease-out forwards;
    }

    /* For chat message animation */
    @keyframes fade-in-and-slide-up {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fade-in-and-slide-up {
      animation: fade-in-and-slide-up 0.5s ease-out forwards;
    }
    
    /* For Login screen animation */
    @keyframes fade-in-and-slide-up-slow {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fade-in-and-slide-up-slow {
      /* Use 'both' to apply starting styles before animation begins (for delays) */
      animation: fade-in-and-slide-up-slow 0.7s ease-out both;
    }
    
    /* For Login screen EXIT animation */
    @keyframes fade-out-and-scale-down {
      from {
        opacity: 1;
        transform: scale(1);
      }
      to {
        opacity: 0;
        transform: scale(0.9);
      }
    }
    .animate-fade-out-and-scale-down {
      animation: fade-out-and-scale-down 0.5s ease-in forwards;
    }

    /* For user message bubbles and popups */
    @keyframes fade-in-and-scale-up {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    .animate-fade-in-and-scale-up {
      animation: fade-in-and-scale-up 0.3s ease-out forwards;
    }


    /* Animation delay utilities */
    .animation-delay-200 { animation-delay: 200ms; }
    .animation-delay-400 { animation-delay: 400ms; }
    .animation-delay-600 { animation-delay: 600ms; }
    .animation-delay-800 { animation-delay: 800ms; }

    /* Basic prose styles for react-markdown */
    .prose {
        max-width: 65ch;
        color: inherit;
    }
    .prose :where(p):not(:where([class~="not-prose"] *)) {
        margin-top: 1em;
        margin-bottom: 1em;
    }
    .prose-invert {
        color: #d1d5db; /* Tailwind gray-300 */
    }
     .prose-invert a {
        color: #2dd4bf; /* Tailwind teal-400 */
    }
    .prose-sm {
        font-size: 0.875rem; /* 14px */
        line-height: 1.625;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://aistudiocdn.com/react@^19.1.1",
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
      "react/": "https://aistudiocdn.com/react@^19.1.1/",
      "@google/genai": "https://aistudiocdn.com/@google/genai@^1.21.0",
      "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0"
    }
  }
  </script>
</head>
<body class="bg-gray-900">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
